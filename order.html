<h2>Place Your Order</h2>

<form action="https://example.com/submit-order" method="POST">
    
    <!-- Customer Information -->
    <label for="name">Full Name *</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email Address *</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="phone">Phone Number *</label><br>
    <input type="tel" id="phone" name="phone" required><br><br>

    <!-- Product Selection -->
    <label for="product">Select Product *</label><br>
    <select id="product" name="product" required>
        <option value="">-- Choose an item --</option>
        <option value="product1">Cakes - R250</option>
        <option value="product2">Croissants - R100</option>
        <option value="product3">Donuts - R80</option>
        <option value="product4">Macarons - R200</option>
        <option value="product5">Cupcakes - R50</option>

    </select>

    <label for="quantity">Quantity *</label><br>
    <input type="number" id="quantity" name="quantity" min="1" value="1" required><br><br>

    <!-- Shipping Information -->
    <label for="address">Shipping Address *</label><br>
    <textarea id="address" name="address" rows="3" required></textarea><br><br>

    <!-- Payment Method -->
    <label for="payment">Payment Method *</label><br>
    <select id="payment" name="payment" required>
        <option value="">-- Select payment method --</option>
        <option value="credit_card">Credit Card</option>
    
    </select><br><br>

    <!-- Submit Button -->
    <input type="submit" value="Submit Order">
